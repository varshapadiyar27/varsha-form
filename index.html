<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>VarshaDevBot Registration</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram ke theme colors apne aap aate hain (light/dark dono) */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #17181a);
    --hint: var(--tg-theme-hint-color, #868a91);
    --field: var(--tg-theme-secondary-bg-color, #f1f2f5);
    --accent: var(--tg-theme-button-color, #2a7ad8);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #d8423a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
    font-size: 16px; line-height: 1.45;
    padding: 20px 18px calc(28px + env(safe-area-inset-bottom, 0px));
    max-width: 480px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  header p { color: var(--hint); margin-top: 4px; font-size: 15px; }

  /* Steps: Details -> Payment -> Confirm */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 22px 0 26px; list-style: none; padding: 0; }
  .steps li { font-size: 13px; color: var(--hint); }
  .steps li::before {
    content: ""; display: block; height: 4px; border-radius: 4px;
    background: var(--field); margin-bottom: 7px;
  }
  .steps li.active { color: var(--text); font-weight: 600; }
  .steps li.active::before { background: var(--accent); }

  form { display: grid; gap: 18px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .control {
    display: flex; align-items: center;
    background: var(--field); border-radius: 12px;
    border: 1.5px solid transparent; transition: border-color .15s;
  }
  .control:focus-within { border-color: var(--accent); }
  .control.invalid { border-color: var(--danger); }
  .prefix { padding-left: 14px; color: var(--hint); font-weight: 500; }
  input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text);
    font: inherit; padding: 14px; outline: none;
  }
  input::placeholder { color: var(--hint); opacity: .8; }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 0; }
  .error:empty { display: none; }

  .fee {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid var(--field); padding-top: 18px; margin-top: 4px;
  }
  .fee span { color: var(--hint); font-size: 14px; }
  .fee strong { font-size: 22px; }

  .note { color: var(--hint); font-size: 13px; margin-top: 10px; }

  #fallbackBtn {
    width: 100%; margin-top: 8px; padding: 15px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer;
  }
  #fallbackBtn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Registration</h1>
    <p>Apni sahi details bharein, inhi par aapko updates milenge.</p>
  </header>

  <ol class="steps" aria-label="Registration steps">
    <li class="active">Details</li>
    <li>Payment</li>
    <li>Confirmation</li>
  </ol>

  <form id="regForm" novalidate>
    <div>
      <label for="name">Poora naam</label>
      <div class="control"><input id="name" name="name" autocomplete="name" placeholder="Jaise: Varsha Sharma"></div>
      <div class="error" id="name-err"></div>
    </div>

    <div>
      <label for="mobile">Mobile number</label>
      <div class="control">
        <span class="prefix">+91</span>
        <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10 digit number">
      </div>
      <div class="error" id="mobile-err"></div>
    </div>

    <div>
      <label for="email">Gmail</label>
      <div class="control"><input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="aapkanaam@gmail.com"></div>
      <div class="error" id="email-err"></div>
    </div>

    <div>
      <label for="age">Age</label>
      <div class="control"><input id="age" name="age" type="text" inputmode="numeric" maxlength="3" placeholder="Jaise: 24"></div>
      <div class="error" id="age-err"></div>
    </div>

    <div>
      <div class="fee"><span>Registration fee</span><strong>₹599</strong></div>
      <p class="note">Payment agle step mein bot ke andar UPI/QR se hoga.</p>
    </div>

    <button type="submit" id="fallbackBtn">Details check karein</button>
  </form>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  const $ = (id) => document.getElementById(id);

  if (tg) { tg.ready(); tg.expand(); }

  // Telegram se naam pehle se bhar dena
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (tgUser) $("name").value = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ");

  // Mobile aur age mein sirf numbers
  ["mobile", "age"].forEach((id) => {
    $(id).addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); });
  });

  // Typing shuru hote hi error hata dena
  ["name", "mobile", "email", "age"].forEach((id) => {
    $(id).addEventListener("input", () => setError(id, ""));
  });

  function setError(id, msg) {
    $(id + "-err").textContent = msg;
    $(id).closest(".control").classList.toggle("invalid", !!msg);
  }

  function validate() {
    const name = $("name").value.trim().replace(/\s+/g, " ");
    const mobile = $("mobile").value.trim();
    const email = $("email").value.trim().toLowerCase();
    const age = $("age").value.trim();
    let ok = true;

    if (name.length < 2) { setError("name", "Apna poora naam likhein."); ok = false; }
    if (!/^[6-9]\d{9}$/.test(mobile)) { setError("mobile", "10 digit ka sahi mobile number likhein."); ok = false; }
    if (!/^[a-z0-9._%+-]+@gmail\.com$/.test(email)) { setError("email", "Sahi Gmail likhein, jaise naam@gmail.com"); ok = false; }
    const ageNum = parseInt(age, 10);
    if (!(ageNum >= 10 && ageNum <= 100)) { setError("age", "Age 10 se 100 ke beech likhein."); ok = false; }

    if (!ok) {
      const first = document.querySelector(".control.invalid input");
      if (first) first.focus();
      return null;
    }
    return { name, mobile, email, age: ageNum };
  }

  function submit(e) {
    if (e) e.preventDefault();
    const data = validate();
    if (!data) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      return;
    }
    if (inTelegram) {
      tg.sendData(JSON.stringify(data)); // details bot ko chali jaati hain aur form band ho jata hai
    } else {
      alert("Ye form Telegram bot ke 'Start Registration' button se kholein.");
    }
  }

  $("regForm").addEventListener("submit", submit);

  // Telegram ke andar native neeche wala button use karna
  if (inTelegram) {
    $("fallbackBtn").hidden = true;
    tg.MainButton.setText("Details check karein");
    tg.MainButton.show();
    tg.MainButton.onClick(submit);
  }
</script>
</body>
</html>
